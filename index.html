<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bloom Studio</title>
  </head>
  <body>
    <div id="app">
      <header class="controls">
        <button id="new-bouquet">New Bouquet</button>
        <button id="arrange-toggle" aria-pressed="true">Arrange Mode: On</button>
      </header>
      <button id="info-btn" aria-label="Info">i</button>
      <div id="canvas-container">
        <div id="loading">Loading bouquet…</div>
      </div>
    </div>
    
    <div id="info-overlay" class="hidden">
      <div id="info-popup">
        <button id="info-close" aria-label="Close">&times;</button>
        <h2>How to Use</h2>
        <ul>
          <li><strong>Drag flowers</strong> to move them around</li>
          <li><strong>Click a flower</strong> to bring it to the front</li>
          <li><strong>New Bouquet</strong> generates a fresh arrangement</li>
        </ul>
      </div>
    </div>
    
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
